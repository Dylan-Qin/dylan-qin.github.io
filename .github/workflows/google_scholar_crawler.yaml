name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Test citation refresh handling
        run: python -m unittest discover -s google_scholar_crawler -p 'test_main.py' -v
      - name: Install requirements
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Load last successful citation data
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: google_scholar_crawler/results
      - name: Refresh citation data
        id: citations
        run: python -u google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish refreshed citation data
        if: steps.citations.outputs.updated == 'true'
        working-directory: google_scholar_crawler/results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data is unchanged.'
            exit 0
          fi
          git commit -m 'Updated Citation Data'
          git push origin HEAD:google-scholar-stats
